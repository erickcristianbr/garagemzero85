<style>
:root{--bg:#f4f4f4;--card:#fff;--fg:#111;--muted:#666;--line:#ddd;--red:#d71920;--hd:#111;--ok:#1a7f37;--warn:#b26a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--card:#1a1a1a;--fg:#fff;--muted:#aaa;--line:#2e2e2e;--red:#ff2d35;--hd:#000;--ok:#3fb950;--warn:#e3a008;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0d;--card:#1a1a1a;--fg:#fff;--muted:#aaa;--line:#2e2e2e;--red:#ff2d35;--hd:#000;--ok:#3fb950;--warn:#e3a008;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--hd);color:#fff;border-bottom:4px solid var(--red)}
.w{max-width:900px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;gap:10px}
#who{font-size:.85rem;color:#ccc;text-align:right}
#who .out{margin-top:6px;padding:4px 12px;border:1px solid #555;border-radius:6px;background:none;color:#ddd;font:inherit;font-size:.8rem;cursor:pointer}#who .out:hover{border-color:var(--red);color:#fff}
.lg{display:inline-flex;flex-direction:column;align-items:flex-end;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;line-height:.88;color:#fff}
.lg b{font-size:2.3rem;letter-spacing:-.5px}.lg .z{font-size:1.65rem;display:flex;gap:3px}.lg .z i:first-child{color:#e10a14}
.lg small{font-family:"Barlow",system-ui,sans-serif;font-style:normal;font-weight:400;font-size:.62rem;margin-top:4px}
.shell{display:flex;max-width:900px;margin:0 auto;min-height:calc(100vh - 90px)}
nav{display:flex;flex-direction:column;gap:2px;width:150px;flex:0 0 150px;background:var(--hd);padding:10px 0}
nav:empty{display:none}
nav button{background:none;border:0;border-left:4px solid transparent;color:#bbb;font:inherit;font-weight:600;padding:12px 10px;text-align:left;cursor:pointer}
nav button.on{color:#fff;border-left-color:var(--red);background:#ffffff14}
main{flex:1;min-width:0;padding:16px 16px 40px}
@media(max-width:480px){nav{width:108px;flex-basis:108px}nav button{padding:12px 6px;font-size:.8rem;overflow-wrap:anywhere}main{padding:12px 10px 40px}}
h2{font-size:1.15rem;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:12px}
.stat b{display:block;font-size:1.4rem}.stat span{color:var(--muted);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.9rem}
form{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px}
